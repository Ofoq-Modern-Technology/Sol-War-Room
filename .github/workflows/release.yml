name: Release Binaries

on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  build-binaries:
    name: Build Standalone Binaries
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all binaries
        run: pnpm --filter @workspace/api-server run build:binary

      - name: List built artifacts
        run: ls -lh artifacts/api-server/dist/

      - name: Upload binaries to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/api-server/dist/solwarroom-linux-x64
            artifacts/api-server/dist/solwarroom-linux-arm64
            artifacts/api-server/dist/solwarroom-win-x64.exe
            artifacts/api-server/dist/solwarroom-macos-x64
            artifacts/api-server/dist/solwarroom-macos-arm64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
